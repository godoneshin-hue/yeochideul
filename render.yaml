services:
  - type: web
    name: yeochideul
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server/server.js
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
